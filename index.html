<style>
  /* Keep the selected sound and its explanation visually connected. */
  .assembly-concept.show { margin-top: 3px; }
  .assembly-concept .concept-card { padding-top: 13px; }
  .assembly-concept .concept-heading {
    margin-bottom: 16px;
    padding-bottom: 12px;
    font-size: 17px;
    font-weight: 750;
    color: #263142;
  }
  .assembly-concept .concept-title { display: none; }
  .assembly-concept #conceptDescription {
    margin: 0 0 14px;
    color: #5f6d80;
  }
  .assembly-concept #conceptDescription strong {
    display: block;
    margin-bottom: 5px;
    font-size: 18px;
    line-height: 1.4;
    color: #263142;
  }
  .assembly-concept #conceptDescription span {
    display: block;
    font-size: 14px;
    line-height: 1.55;
  }
  .recording-review {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--line);
  }
  .recording-review h3,
  .recording-compact strong {
    margin: 0;
    padding: 0;
    border: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .recording-play {
    min-width: 88px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 14px;
    border: 1px solid #c8d9f8;
    border-radius: 12px;
    background: #f4f8ff;
    color: var(--blue);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .recording-play svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .advice-heading {
    margin: 14px 0 2px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .recording-compact {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);

async function record(){const mic=$('mic');if(mic.classList.contains('recording'))return;teachingRun++;stopPlayback();$('speechFeedback').classList.remove('show');document.querySelector('.speech-actions').classList.remove('paired');$('retryButton').classList.remove('show');$('skipButton').classList.remove('show');$('nextButton').classList.remove('show');try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});recordingChunks=[];const mimeType=preferredRecordingType();mediaRecorder=new MediaRecorder(mediaStream,mimeType?{mimeType}:undefined);mediaRecorder.ondataavailable=event=>{if(event.data.size)recordingChunks.push(event.data)};mediaRecorder.onstop=async()=>{clearTimeout(recordingTimer);mic.classList.remove('recording');mic.style.display='none';$('wave').classList.remove('show');$('loader').classList.add('show');const type=mediaRecorder.mimeType||mimeType||'audio/webm',blob=new Blob(recordingChunks,{type});stopMediaStream();await submitRecording(blob,type)};mediaRecorder.start();mic.classList.add('recording');$('wave').classList.add('show');recordingTimer=setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},1700)}catch(error){stopMediaStream();handleRecordingFailure()}}
async function submitRecording(blob,mimeType){setRecordedAudio(blob);const extension=mimeType.includes('mp4')?'m4a':mimeType.includes('wav')?'wav':'webm',form=new FormData();form.append('audio',blob,'recording.'+extension);form.append('platform','azure');form.append('locale','fr-FR');form.append('userName','french_pronunciation_demo');const endpoint=location.protocol==='file:'?'http://127.0.0.1:4173/api/asr':'/api/asr';try{const response=await fetch(endpoint,{method:'POST',body:form}),payload=await response.json();if(!response.ok||payload?.code===300)throw new Error(payload?.msg||'ASR '+response.status);const text=payload?.data?.text||payload?.text||'';showSpeechFeedback(isAcceptedRecognition(text))}catch(error){handleRecordingFailure()}}
function handleRecordingFailure(){$('loader').classList.remove('show');$('wave').classList.remove('show');$('mic').classList.remove('recording');$('mic').style.display='none';const playback=recordedAudioUrl?recordingPlayButton():'';$('speechFeedback').innerHTML='<div class="recording-compact"><strong>我的录音</strong>'+playback+'</div>';$('speechFeedback').classList.add('show');document.querySelector('.speech-actions').classList.add('paired');$('retryButton').classList.add('show');$('skipButton').classList.remove('show');$('nextButton').classList.add('show')}
function normalizeRecognition(text){return text.toLocaleLowerCase('fr-FR').normalize('NFC').replace(/[.,!?;:«»“”"']/g,' ').replace(/\s+/g,' ').trim()}
function isAcceptedRecognition(text){const recognized=normalizeRecognition(text),accepted=practices[practiceIndex].accepted||[practices[practiceIndex].word];return accepted.some(item=>{const expected=normalizeRecognition(item);return expected.includes(' ')?recognized===expected||recognized.includes(expected):recognized.split(' ').includes(expected)})}
function recordingPlayButton(){return '<button class="recording-play" aria-label="播放我的录音" onclick="playMyRecording()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>播放</span></button>'}
function showSpeechFeedback(correct){$('loader').classList.remove('show');const p=practices[practiceIndex],word=$('practiceWord'),recordingButton=recordingPlayButton();if(correct){word.innerHTML='<span class="word-result correct">'+p.word+'</span>';$('speechFeedback').innerHTML='<div class="recording-compact"><strong>我的录音</strong>'+recordingButton+'</div>';$('speechFeedback').classList.add('show');$('nextButton').classList.add('show');return}word.innerHTML='<span class="word-result wrong">'+p.word+'</span>';$('speechFeedback').innerHTML='<article class="knowledge recording-feedback"><div class="recording-review"><h3>我的录音</h3>'+recordingButton+'</div><h4 class="advice-heading">发音建议</h4><div class="feedback-points">'+p.tips.map(tip=>'<div class="knowledge-point"><div class="knowledge-copy"><b><span class="grapheme">'+tip.g+'</span><span>'+tip.title+'</span></b><p>'+tip.body+'</p></div><button class="tip-audio" aria-label="播放 '+tip.g+'" onclick="speak(\''+tip.audio+'\',.76)"><svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7l-4 3H5Z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/></svg></button></div>').join('')+'</div></article>';$('speechFeedback').classList.add('show');$('retryButton').classList.add('show');$('skipButton').classList.add('show')}
function retryRecording(){$('practiceWord').innerHTML=speakingWordHTML(practices[practiceIndex]);$('speechFeedback').classList.remove('show');document.querySelector('.speech-actions').classList.remove('paired');$('retryButton').classList.remove('show');$('skipButton').classList.remove('show');$('mic').style.display='grid';record()}
function showListeningQuestion(target='sous',step=1){clearRecordedAudio();stopPlayback();listeningTarget=target;listeningStep=step;listeningChoice='';listeningChecked=false;$('listeningReveal').classList.remove('show');$('listeningPrompt').setAttribute('aria-label','再听一遍 '+target);setPage('listeningPage',step);renderListeningQuestion();setTimeout(()=>playWord(target),260)}
function renderListeningQuestion(){const correct=listeningChecked&&listeningChoice===listeningTarget;document.querySelectorAll('.listening-option').forEach(option=>{const word=option.dataset.word;option.classList.toggle('selected',!listeningChecked&&word===listeningChoice);option.classList.toggle('correct',listeningChecked&&word===listeningTarget);option.classList.toggle('wrong',listeningChecked&&word===listeningChoice&&word!==listeningTarget);option.setAttribute('aria-pressed',String(word===listeningChoice));option.setAttribute('aria-disabled',String(listeningChecked))});$('listeningCheck').disabled=!listeningChoice||(listeningChecked&&!correct);$('listeningCheck').textContent=correct?'继续':'确认';$('listeningCheck').onclick=correct?finishListening:checkListeningAnswer}
function selectListeningAnswer(word){if(listeningChecked){playWord(word);return}listeningChoice=word;renderListeningQuestion();playWord(word)}
function showListeningReveal(){const isU=listeningTarget==='sous';currentPhoneme=isU?'u':'i';$('listeningPhoneme').textContent=isU?'/u/':'/i/';$('listeningPosition').textContent=isU?'双唇收圆，舌头向后，听起来接近中文中的“乌”。':'嘴角向两侧展开，舌位靠前，听起来接近中文中的“衣”。';$('listeningSpelling').textContent=isU?'ou':'i';$('listeningExamples').textContent=isU?'sous · cou':'si · midi';$('listeningPhonemePlay').setAttribute('aria-label','播放 '+(isU?'/u/':'/i/'));$('listeningReveal').classList.add('show');setTimeout(()=>playListeningPhoneme(),180)}
function playListeningPhoneme(){speak(currentPhoneme==='u'?'ou':'i',.72)}
function checkListeningAnswer(){if(!listeningChoice||listeningChecked)return;listeningChecked=true;renderListeningQuestion();if(listeningChoice===listeningTarget)return;setTimeout(()=>{listeningChecked=false;listeningChoice='';renderListeningQuestion()},720)}
function finishListening(){stopPlayback();showPhonemeCard('i',7)}
function showComparisonQuestion(){stopPlayback();comparisonChoice='';comparisonChecked=false;document.querySelectorAll('.comparison-word').forEach(card=>card.classList.remove('playing'));document.querySelectorAll('.comparison-option').forEach(option=>option.className='comparison-option');$('comparisonResult').classList.remove('show');$('comparisonCheck').disabled=true;$('comparisonCheck').textContent='确认';$('comparisonCheck').onclick=checkComparisonAnswer;setPage('comparisonPage',10)}
function playComparisonWord(word,card){document.querySelectorAll('.comparison-word').forEach(item=>item.classList.toggle('playing',item===card));playWord(word,()=>card.classList.remove('playing'))}
function selectComparisonAnswer(answer){if(comparisonChecked)return;comparisonChoice=answer;document.querySelectorAll('.comparison-option').forEach(option=>option.classList.toggle('selected',option.dataset.comparisonAnswer===answer));$('comparisonCheck').disabled=false}
function checkComparisonAnswer(){if(!comparisonChoice||comparisonChecked)return;comparisonChecked=true;const correct=comparisonChoice==='same';document.querySelectorAll('.comparison-option').forEach(option=>{option.classList.remove('selected');if(option.dataset.comparisonAnswer===comparisonChoice)option.classList.add(correct?'correct':'wrong')});if(!correct){$('comparisonCheck').disabled=true;setTimeout(()=>{comparisonChoice='';comparisonChecked=false;document.querySelectorAll('.comparison-option').forEach(option=>option.className='comparison-option');$('comparisonCheck').disabled=true},720);return}$('comparisonResult').classList.add('show');$('comparisonCheck').textContent='继续';$('comparisonCheck').onclick=()=>showSpellingPage('i')}
function showSpellingPage(phoneme){stopPlayback();currentPhoneme=phoneme;const data=phoneme==='u'?{step:6,title:'读音为 /u/ 的字母组合',summary:'通过刚才的题目你会发现，ou、oû 的发音都是 /u/。',rows:[{key:'ou',word:'cou',display:'c<mark>ou</mark>',ipa:'/ku/',meaning:'脖子'},{key:'oû',word:'goût',display:'g<mark>oû</mark>t',ipa:'/gu/',meaning:'味道'},{key:'où',word:'où',display:'<mark>où</mark>',ipa:'/u/',meaning:'哪里',divider:'除此之外，où 也发相同的音。'}],next:showIRulePage}:{step:11,title:'读音为 /i/ 的字母',summary:'通过刚才的题目你会发现，i、y 的发音都是 /i/。',rows:[{key:'i',word:'sandwich',display:'sandw<mark>i</mark>ch',ipa:'/sɑ̃.dwitʃ/',meaning:'三明治'},{key:'y',word:'stylo',display:'st<mark>y</mark>lo',ipa:'/sti.lo/',meaning:'圆珠笔'},{key:'î',word:'dîner',display:'d<mark>î</mark>ner',ipa:'/di.ne/',meaning:'吃晚饭',divider:'除此之外，î、ï 也发相同的音。'},{key:'ï',word:'maïs',display:'ma<mark>ï</mark>s',ipa:'/ma.is/',meaning:'玉米'}],next:()=>showSpeakingPractice(4)};$('spellingTitle').textContent=data.title;$('spellingSummary').textContent=data.summary;$('spellingRows').innerHTML=data.rows.map(item=>(item.divider?'<p class="spelling-divider">'+item.divider+'</p>':'')+'<section class="spelling-group"><div class="spelling-group-head"><h2>'+item.key+'</h2></div><article class="spelling-example"><div class="spelling-example-copy"><div class="spelling-example-word">'+item.display+'</div><div class="spelling-example-meta">'+item.ipa+'　'+item.meaning+'</div></div><button class="spelling-example-play" aria-label="播放 '+item.word+'" onclick="playWord(\''+item.word+'\')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5Z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/></svg></button></article></section>').join('');$('spellingNext').onclick=data.next;setPage('spellingPage',data.step)}
function skipSpeaking(){nextPractice()}
function nextPractice(){const word=practices[practiceIndex].word;if(word==='cou'){showSpeakingPractice(3);return}if(word==='goût'){showSpellingPage('u');return}if(word==='midi'){showComparisonQuestion();return}finishLesson()}
function finishLesson(){stopPlayback();setPage('completePage',totalSteps)}
function restart(){stopPlayback();clearRecordedAudio();showTargetPage()}
showTargetPage();
document.addEventListener('click',event=>{if(!$('stepMenu').contains(event.target)&&!$('counter').contains(event.target))closeStepMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeStepMenu()});
</script>
